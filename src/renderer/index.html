<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.modrinth.com https://media.forgecdn.net https://edge.forgecdn.net; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="theme-color" content="#101012"><title>AstraLauncher</title><link rel="icon" href="assets/astra-icon.png"><link rel="stylesheet" href="styles/main.css"></head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#discover" data-page="discover"><img src="assets/astra-icon.png" alt=""><span>ASTRA<span class="brand-sub">LAUNCHER</span></span></a>
      <div class="nav-label">ПРОСТРАНСТВО</div>
      <nav id="navigation"></nav>
      <div class="side-library"><div class="nav-label">МОИ СБОРКИ<button class="icon-button" data-action="create" aria-label="Создать сборку">+</button></div><div id="side-packs"></div></div>
      <div class="side-bottom"><button class="support" data-action="support"><span>♡</span><div>Сделано с любовью<small>Поддержать Astra</small></div><span>↗</span></button><button class="account" data-action="account"><span class="avatar">V</span><div id="profile-label">Игрок<small>Локальный профиль</small></div><span class="account-dots">•••</span></button></div>
    </aside>
    <div class="workspace">
      <header class="toolbar"><div class="breadcrumb"><span>ASTRA</span><span class="slash">/</span><span id="current-page">Открывай</span></div><div class="toolbar-right"><span class="preview-badge">PREVIEW 0.7</span><button class="icon-button" data-action="notifications" aria-label="Уведомления" id="notification-button"></button><button class="icon-button" data-action="settings" aria-label="Настройки" id="settings-button"></button></div></header>
      <main id="main"></main>
      <footer><span><i class="status-dot"></i> Каталог подключён</span><span>Предварительная версия <span class="footer-star">✧</span> AstraLauncher</span></footer>
    </div>
  </div>
  <dialog id="modal"><div id="modal-content"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
  <script defer src="core/ui.js"></script>
<script defer src="data/mods.js"></script>
<script defer src="core/state.js"></script>
<script defer src="core/versions.js"></script>
<script defer src="pages/library.js"></script>
<script defer src="core/actions.js"></script>
<script defer src="pages/workspace.js"></script>
<script defer src="core/live.js"></script>
<script defer src="core/personalization.js"></script>
<script defer src="desktop.js"></script>
</body></html>
